      text: "#073642"
      muted: "#47606a"
      faint: "#586e78"
      state-idle: "#1b6aa5"
      state-running: "#547300"
      state-dead: "#c0392b"
      ok: "#436000"
      warn: "#7a5000"
      danger: "#a3201a"
      sunk: "rgba(7, 54, 66, 0.05)"
      shadow: "rgba(7, 54, 66, 0.18)"
