# Colour schemes as data: colours only, no code and no CSS. AstroAI writes the style rule from these, and refuses a scheme
# whose text can't be read (text, muted, faint, the accent and the status colours need 4.5:1 on the panel colour).
schemes:
  - id: nord
    label: Nord
    note: Arctic blue-grey with frost accents
    style: material
    tone: dark
    tokens:
      bg: "#2e3440"
      bg-2: "#3b4252"
      panel: "rgba(59, 66, 82, 0.72)"
      panel-solid: "#3b4252"
      panel-2: "rgba(67, 76, 94, 0.7)"
      line: "rgba(216, 222, 233, 0.16)"
      line-strong: "rgba(216, 222, 233, 0.38)"
      glow: "rgba(136, 192, 208, 0.22)"
      accent: "#9bcddb"
      accent-2: "#81a1c1"
      text: "#eceff4"
      muted: "#c2cada"
      faint: "#a9b3c5"
      state-idle: "#9bcddb"
      state-running: "#bad7a1"
      state-dead: "#f6b8bd"
      ok: "#bad7a1"
      warn: "#f0d79a"
      danger: "#f6b8bd"
      sunk: "rgba(0, 0, 0, 0.2)"
      shadow: "rgba(0, 0, 0, 0.4)"
  - id: gruvbox
    label: Gruvbox
    note: Warm retro browns with amber light
    style: hud
    tone: dark
    tokens:
      bg: "#1d2021"
      bg-2: "#282828"
      panel: "rgba(40, 40, 40, 0.7)"
      panel-solid: "#282828"
      panel-2: "rgba(60, 56, 54, 0.7)"
      line: "rgba(235, 219, 178, 0.18)"
      line-strong: "rgba(235, 219, 178, 0.42)"
      glow: "rgba(250, 189, 47, 0.3)"
      accent: "#fabd2f"
      accent-2: "#fe8019"
      text: "#ebdbb2"
      muted: "#bdae93"
      faint: "#a89984"
      state-idle: "#83a598"
      state-running: "#b8bb26"
      state-dead: "#fb4934"
      ok: "#b8bb26"
      warn: "#fabd2f"
      danger: "#fe6a55"
  - id: solarized-light
    label: Solarized Light
    note: Cream paper with deep teal ink
    style: material
    tone: light
    tokens:
      bg: "#fdf6e3"
      bg-2: "#eee8d5"
      panel: "rgba(255, 252, 243, 0.9)"
      panel-solid: "#fffcf2"
