id: outlook
name: Outlook mail
description: "The mail that needs you in Outlook (Microsoft 365): unread or important, addressed to you and not answered yet."
icon: mail
hosts: [graph.microsoft.com, login.microsoftonline.com]
docs: https://learn.microsoft.com/graph/api/user-list-messages
# Microsoft Graph. AstroAI signs you in with OAuth and signs each request with a short-lived access token; the plugin never sees it.
http:
  base_url: https://graph.microsoft.com/v1.0
  oauth: true
  header: authorization
  prefix: "Bearer "
# The only write this plugin may make: the whole of one request. AstroAI refuses anything else, and only sends it after you confirmed it.
effects:
  - { id: email.reply, writes: [{ method: POST, path: "/me/messages/{id}/reply" }] }
auth:
  - id: microsoft
    label: Microsoft account (OAuth)
    help: "Register an app in Microsoft Entra (portal.azure.com → App registrations), add the redirect URI shown below as a Mobile and desktop application, and allow the Graph delegated permissions Mail.Read, Mail.Send, User.Read and offline_access. Paste its Application (client) ID. Then Sign in."
    oauth:
      authorize_url: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
      token_url: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
      scopes: [offline_access, User.Read, Mail.Read, Mail.Send]
      params: { prompt: select_account }
    fields:
      - { key: client_id, label: Application (client) ID, type: string, required: true, pattern: "^[0-9a-fA-F-]{36}$", placeholder: "00000000-0000-0000-0000-000000000000" }
      - { key: tenant, label: Directory (tenant), type: string, required: true, default: organizations, pattern: "^[A-Za-z0-9.-]{1,64}$", help: "organizations (work or school accounts), common, consumers, or your tenant id or domain." }
kinds:
  - id: mailbox
    label: Mailbox
    capability: email
    description: "Your Outlook inbox: what needs a reply from you."
    scope: []
