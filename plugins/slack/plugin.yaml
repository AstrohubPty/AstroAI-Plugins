api: 1
id: slack
name: Slack
version: 1.1.0
type: integration
description: "What needs you in Slack: mentions, direct messages and threads you are in, and the channels you watch, read with your own token; reply as you after you confirm."
author: AstroHub
license: Apache-2.0
homepage: https://github.com/AstrohubPty/AstroAI-Plugins/tree/main/plugins/slack
permissions:
  network: [slack.com]
  capabilities: [chat]
  # A reply, as you: drafted in AstroAI's approval queue and posted only after you confirm it (dry-run, the default, only records it).
  effects: [chat.reply]
provides:
  integration: { manifest: integration.yaml, runtime: runtime.ts }
