api: 1
id: clickup
name: ClickUp
version: 1.1.0
type: integration
description: Tasks from the ClickUp lists you choose, read with your personal API token.
author: AstroHub
license: Apache-2.0
homepage: https://github.com/AstrohubPty/AstroAI-Plugins/tree/main/plugins/clickup
permissions:
  network: [api.clickup.com]
  capabilities: [tickets]
  # Writes: each is drafted in AstroAI's approval queue and done only after you confirm it (dry-run, the default, only records it).
  effects: [tickets.comment, tickets.move]
provides:
  integration: { manifest: integration.yaml, runtime: runtime.ts }
